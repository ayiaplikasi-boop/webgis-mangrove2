<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WebGIS Sebaran Kerapatan Mangrove</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<link rel="stylesheet"
href="style.css"/>

</head>

<body>

<header>

<div class="header-title">

<h2>WebGIS Sebaran Kerapatan Mangrove</h2>

<p>
Desa Tapak, Kecamatan Tugu,
Kota Semarang
</p>

</div>

</header>

<div id="sidebar">

<h2>Informasi</h2>

<p>

Peta ini menyajikan hasil pemetaan
sebaran kerapatan mangrove
di Desa Tapak,
Kecamatan Tugu,
Kota Semarang.

</p>

<hr>

<h3>Legenda</h3>

<div class="legend-item">

<span class="red"></span>

Mangrove Rapat

</div>

<div class="legend-item">

<span class="green"></span>

Mangrove Sedang

</div>

<div class="legend-item">

<span class="yellow"></span>

Mangrove Jarang

</div>

<div class="legend-item">

<span class="blue"></span>

Badan Air

</div>

<hr>

<button id="openImg">

Lihat Hasil Klasifikasi

</button>

</div>

<div id="map"></div>

<div id="modal">

<div class="modal-content">

<span id="close">

&times;

</span>

<img
src="mangrove.png"
alt="Peta Mangrove">

</div>

</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="script.js"></script>

</body>

</html>
